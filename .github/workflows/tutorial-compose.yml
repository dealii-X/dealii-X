name: Tutorial Compose

on:
  pull_request:
    paths:
      - compose.yaml
      - containers/execution/**
      - scripts/tutorial-init.sh
      - .github/workflows/tutorial-compose.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - containers/execution/**
      - scripts/tutorial-init.sh
      - .github/workflows/tutorial-compose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and release tag selection
        run: |
          bash -n scripts/tutorial-init.sh containers/execution/entrypoint.sh
          check_tags() {
            local immersx=$1 visualizer=$2 platform=$3
            docker compose config --format json |
              jq -e --arg immersx "$immersx" --arg visualizer "$visualizer" --arg platform "$platform" '
                .services["prepare-examples"].image == ("ghcr.io/luca-heltai/immersx:" + $immersx) and
                .services["coral-ssh-slurm"].build.args.IMMERSX_IMAGE == ("ghcr.io/luca-heltai/immersx:" + $immersx) and
                .services["coral-visualizer"].image == ("ghcr.io/2listic/coral-visualizer:" + $visualizer) and
                .services["dealiix-platform"].image == ("ghcr.io/2listic/dealiix-platform:" + $platform)
              '
          }
          check_tags main main main
          IMMERSX_TAG=v1.2.3 CORAL_VISUALIZER_TAG=v2.3.4 DEALIIX_PLATFORM_TAG=v3.4.5 \
            check_tags v1.2.3 v2.3.4 v3.4.5

  execution:
    if: github.event_name != 'pull_request'
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the execution service and test SSH and Slurm
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          ./scripts/tutorial-init.sh
          docker compose build --pull coral-ssh-slurm
          trap 'docker compose logs coral-ssh-slurm; docker compose down' EXIT
          docker compose up -d --wait --wait-timeout 90 coral-ssh-slurm
          docker compose exec -T coral-ssh-slurm ssh -i /tutorial-ssh/id_ed25519 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
            root@localhost 'coral-release --help && scontrol ping | grep -q UP'
          timeout 60 docker compose exec -T coral-ssh-slurm srun --mpi=none -n 1 /bin/true
