[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealiix-integration"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reproducible file-coupled multi-organ workflows"

[project.scripts]
dealiix = "dealiix.__main__:main"

[tool.setuptools]
packages = ["dealiix"]
